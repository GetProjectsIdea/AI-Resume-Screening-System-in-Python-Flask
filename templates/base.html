<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}AI Resume Screening System{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{{ url_for('index') }}">Resume<span>Match</span> AI</a>
    <nav>
      <a href="{{ url_for('index') }}">New Screening</a>
      <a href="{{ url_for('history') }}">History</a>
    </nav>
  </header>
  <main class="container">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="alert alert-{{ category }}">{{ message }}</div>
      {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
  <footer class="footer">
    v{{ version }} · Open-source project by <a href="https://getprojects.org/">GetProjects.org</a> · MIT License
  </footer>
</body>
</html>
